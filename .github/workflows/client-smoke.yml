name: Vision Mod client startup smoke test

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - '.github/workflows/client-smoke.yml'
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke-client:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Prepare client dependencies before timed smoke
        run: gradle build downloadAssets --no-daemon --console=plain --max-workers=2
      - name: Prepare screenshot utility
        run: |
          python3 -m pip install Pillow
          python3 tests/test-capture.py
      - name: Start Minecraft in virtual display
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          VISIONMOD_SELFTEST: "1"
          VISIONMOD_VISUAL_QA: "1"
          MESA_GL_VERSION_OVERRIDE: "3.3"
        run: |
          set +e
          command -v xvfb-run
          xvfb-run -a -s '-screen 0 1280x720x24' bash -c '
            timeout --signal=TERM 100s gradle runClient --no-daemon --console=plain > smoke-client.log 2>&1 &
            game=$!
            python3 tests/capture-editors.py > capture-editors.log 2>&1
            capture=$?
            cat capture-editors.log
            wait "$game"
            status=$?
            printf "Game process status: %s\nCapture status: %s\n" "$status" "$capture" > game-exit-status.txt
            if [ "$capture" -ne 0 ]; then exit "$capture"; fi
            exit "$status"
          '
          status=$?
          set -e
          echo "Smoke runner status: $status" | tee smoke-status.txt
          cat game-exit-status.txt
          tail -n 100 smoke-client.log
          if grep -Eiq 'MixinApplyError|InvalidInjectionException|MixinTransformerError|NoClassDefFoundError|Crash report saved|The game crashed|SELFTEST.*failed|SELFTEST.*exception' smoke-client.log; then
            echo "Found a fatal client / mixin exception"
            exit 1
          fi
          if ! grep -q '\[VisionMod\]\[SELFTEST\] PASS: 55 module toggles' smoke-client.log; then
            echo "Feature toggle and persistence self-tests did not complete successfully"
            exit 1
          fi
          if [ "$status" -eq 0 ]; then
            echo "Client process exited normally, inspect game logs for launch proof"
            exit 0
          fi
          if [ "$status" -eq 124 ]; then
            echo "Client ran until time limit; not proof that game rendering worked"
            exit 0
          fi
          echo "Unexpected client exit status: $status"
          exit 1
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VisionMod-Client-Smoke-Logs
          path: |
            capture-editors.log
            editor-captures/**
            smoke-client.log
            smoke-status.txt
            game-exit-status.txt
            run/logs/latest.log
            run/crash-reports/**
          if-no-files-found: warn
          retention-days: 7

      - name: Check out isolated CI evidence branch
        if: always()
        uses: actions/checkout@v4
        with:
          ref: codex/visual-evidence
          path: .qa-evidence
      - name: Save smoke outputs outside source branch
        if: always()
        run: bash tests/publish-evidence.sh smoke
